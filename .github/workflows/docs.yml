name: docs

# Build the Zensical site and publish it to GitHub Pages.
#
# The docs build is CPU-only: mkdocstrings reads the cupiqp source statically
# and never imports the package, so it runs on a standard GitHub-hosted runner
# with no GPU/CUDA.
#
# One-time repo setup: Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions".

on:
  push:
    # main: build + deploy.  develop: build-only (strict link check), no deploy.
    branches: [main, develop]
    # Rebuild only when docs-relevant files change.
    paths:
      - "docs/**"
      - "cupiqp/**"
      - "zensical.toml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys clobbering each other.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs

      # Fail the build on broken nav links / missing pages before deploying.
      - name: Build (strict)
        run: zensical build --clean --strict

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the built site -- main only, so that building develop tests the
  # docs without overwriting the live site.
  deploy:
    name: deploy docs
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
